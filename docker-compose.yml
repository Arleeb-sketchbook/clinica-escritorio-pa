# Base de datos del laboratorio.
#   Levantar:  docker compose up -d
#   Apagar:    docker compose down
#   Borrar todo y empezar de cero:  docker compose down -v
services:
  db:
    image: postgres:16
    container_name: postgres-clinica
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1122
    ports:
      - "5432:5432"
    volumes:
      - C:/Docker/Postgres:/var/lib/postgresql/data
