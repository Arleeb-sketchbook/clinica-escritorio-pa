# Base de datos del laboratorio.
#   Levantar:  docker compose up -d
#   Apagar:    docker compose down
#   Borrar todo y empezar de cero:  docker compose down -v
services:
  db:
    image: postgres:16
    container_name: postgres-clinica
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinica}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_clinica_data:/var/lib/postgresql/data

volumes:
  postgres_clinica_data:
